<link rel="stylesheet" href="style.css" />


<div class="container">

  <h1 class="title">BRACKET.CITY</h1>

  <div class="subtitle">
    CYBER PUZZLE ENGINE
  </div>

  <div class="game-box">

    <div class="puzzle" id="puzzle"></div>

    <div class="panel">

      <div class="current-label">
        CURRENT CLUE
      </div>

      <div class="current-clue" id="currentClue">
        Select a highlighted clue
      </div>

      <div class="input-wrap">

        <input
          id="answerInput"
          type="text"
          placeholder="ENTER ANSWER..."
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />

        <button id="submitBtn">
          SUBMIT
        </button>

      </div>

      <div class="status" id="status"></div>

    </div>

    <div class="complete" id="complete"></div>

  </div>

</div>

  <script src="script.js"></script>
